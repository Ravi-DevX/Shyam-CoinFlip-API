name: Verify API

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean test javadocJar sourcesJar publishToMavenLocal
